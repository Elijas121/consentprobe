name: consentprobe
description: Measure what a website does before and after the cookie banner and fail the job on findings. Sets up Node 22 and pnpm for the rest of the job.
author: Elias Delil
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: URL to scan
    required: true
  fail-on:
    description: "Fail the job at this severity or above: error, warn or never (never also ignores a page that cannot be measured)"
    default: error
  imprint:
    description: "Imprint check: auto, always or never"
    default: auto
  first-party:
    description: Extra first-party domain of the site operator (one domain)
    default: ""
  report:
    description: Path of the Markdown report file
    default: consentprobe-report.md

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Install consentprobe
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium
        pnpm build
    - name: Scan
      shell: bash
      env:
        CP_URL: ${{ inputs.url }}
        CP_FAIL_ON: ${{ inputs.fail-on }}
        CP_IMPRINT: ${{ inputs.imprint }}
        CP_FIRST_PARTY: ${{ inputs.first-party }}
        CP_REPORT: ${{ inputs.report }}
      run: |
        args=("$CP_URL" --format md --out "$CP_REPORT" --fail-on "$CP_FAIL_ON" --imprint "$CP_IMPRINT")
        if [ -n "$CP_FIRST_PARTY" ]; then args+=(--first-party "$CP_FIRST_PARTY"); fi
        rm -f "$CP_REPORT"
        err="$RUNNER_TEMP/consentprobe-stderr.txt"
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" 2> "$err"
        code=$?
        set -e
        # The error text can quote the scanned page: never let it act as a workflow command.
        token="consentprobe-$RANDOM$RANDOM$RANDOM"
        echo "::stop-commands::$token"
        cat "$err"
        echo "::$token::"
        if [ -f "$CP_REPORT" ]; then
          cat "$CP_REPORT" >> "$GITHUB_STEP_SUMMARY"
        elif [ -s "$err" ]; then
          # An indented code block cannot be closed by the quoted text.
          { echo "### consentprobe could not measure the page"; echo; sed 's/^/    /' "$err"; } >> "$GITHUB_STEP_SUMMARY"
        fi
        # fail-on: never means never: also a page that cannot be measured does not fail the job.
        if [ "$CP_FAIL_ON" = "never" ]; then exit 0; fi
        exit $code
